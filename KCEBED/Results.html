<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Results | KCEBED</title>

  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/media.css" />

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<body>


<div id="site-header"></div>

<div class="page-header">

    <h1>Examination Results</h1>

        <h4 class="results-year">2023-24 Academic Year</h4>
        <div class="grid-2">

            <h5>UG (B.Ed.)</h5>

            </div>
          </div>

          <div class="result-card">
            <h5>PG (M.Ed.)</h5>
            <div class="result-stats">
              <div class="stat-item"><span class="stat-label">Pass %</span><span class="stat-value">100%</span></div>
              <div class="stat-item"><span class="stat-label">Distinctions</span><span class="stat-value">07</span></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<div id="site-footer"></div>
